    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    extra: 'readonly -a _stages=("https://github.com/example/harness-baseline/raw/main/stage")

      '
    payload: "  cd \"$srcdir\"/harness-baseline-1.0.0\n  curl -fsSLO \"${_stages[0]}\"\n  sh ./configure\n\
      \  make"
- id: local-r-url-in-build
