# Probe for R152 (Source URL On Free-Hosting Or Dynamic-DNS Host).
# The recipe keeps a declared source and an interpreter sink so the behaviour
# validator can certify a fetch-to-execution chain; TrustSight is then asked
# whether R152 catches the payload served from a dynamic-DNS host.
campaign: freehosting-source-r152
campaign_type: deterministic

environment:
  trustsight_version: "0.17.2"
  trustsight_source: "local-path"
  db_state: "cold"
  flag_threshold: 20

generator:
  type: manual
  directory: manual
  baseline: defaults/baseline.PKGBUILD

prompt:
  prompt_id: freehosting-source-r152
  behavior_goal: fetch_then_execute
  expected_rules: ["R152"]
  forbidden_techniques: {}

attempts: 1
