# Probe for R091 (Privilege Escalation Override).
# The recipe keeps a declared source and an interpreter sink so the behaviour
# validator can certify a fetch-to-execution chain; TrustSight is then asked
# whether R091 catches the technique on top of that chain.
campaign: override-pacman-auth-r091
campaign_type: deterministic

environment:
  trustsight_version: "0.15.7"
  trustsight_source: "local-path"
  db_state: "cold"
  flag_threshold: 20

generator:
  type: manual
  directory: manual
  baseline: defaults/baseline.PKGBUILD

prompt:
  prompt_id: override-pacman-auth-r091
  behavior_goal: fetch_then_execute
  expected_rules: ["R091"]
  forbidden_techniques: {}

attempts: 1
