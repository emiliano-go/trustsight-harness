name: Docker image

# Publishes the GHCR image for a release.  `release: published` fires when a
# human publishes through the UI or `gh`; the image carries a pinned TrustSight
# checkout, so the container is the reproducible harness by construction.
# `workflow_dispatch` rebuilds an existing tag by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0
        required: true
        type: string

# Least privilege at the top level; the push job grants itself `packages: write`.
permissions:
  contents: read

jobs:
  publish:
    name: Build, smoke test, and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the image version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not a software release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Guard against pre-Dockerfile tags
        run: |
          # A tag cut before the Dockerfile existed cannot produce an image
          # of itself; say so rather than failing inside buildx.
          if [[ ! -f Dockerfile ]]; then
            echo "::error::${{ steps.meta.outputs.tag }} predates the Dockerfile; the image stream starts with the next release"
            exit 1
          fi

      # The harness measures a pinned TrustSight, so the build needs both trees
      # side by side.  The commit is read from the repository, not repeated here,
      # so the image and CI cannot pin different instruments.  Only tracked
      # files are copied, so no `.git` or `.venv` reaches the build context,
      # and only the core paths an editable install needs are taken.
      - name: Assemble the build context
        run: |
          set -eu
          core_sha="$(cat .github/trustsight-commit)"
          echo "TrustSight commit: $core_sha"
          mkdir -p context/trustsight-harness context/trustsight
          git archive HEAD | tar -x -C context/trustsight-harness
          git clone --quiet https://github.com/emiliano-go/trustsight.git /tmp/trustsight
          git -C /tmp/trustsight checkout --quiet "$core_sha"
          test "$(git -C /tmp/trustsight rev-parse HEAD)" = "$core_sha"
          git -C /tmp/trustsight archive HEAD -- pyproject.toml README.md LICENSE src \
            | tar -x -C context/trustsight

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The image is exercised before it can be pushed: `--help` proves the
      # entrypoint, and `coverage` plus `regression` exercise the pinned
      # instrument and the committed corpus without touching the network.
      - name: Build the image
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          docker build -f context/trustsight-harness/Dockerfile -t "$image" context
          docker run --rm "$image" --help
          docker run --rm "$image" coverage
          docker run --rm "$image" regression

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker push "$image"
          # `latest` tracks stable releases only; a prerelease must not move it.
          if [ "${{ steps.meta.outputs.prerelease }}" != "true" ]; then
            docker tag "$image" "ghcr.io/${GITHUB_REPOSITORY}:latest"
            docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
