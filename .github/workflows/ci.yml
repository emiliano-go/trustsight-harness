name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The instrument under test.  The commit lives in
      # `.github/trustsight-commit`, read here and by the Docker workflow, so
      # the clone, the assertion and the image cannot pin different trees -
      # which is how the repo once pinned 0.14.0 in CI while every campaign
      # declared 0.13.2.
      - name: Resolve the pinned TrustSight commit
        run: echo "TRUSTSIGHT_COMMIT=$(cat .github/trustsight-commit)" >> "$GITHUB_ENV"

      # actions/checkout refuses a path outside $GITHUB_WORKSPACE, so clone
      # the sibling manually; the lockfile expects ../trustsight.
      - name: Clone TrustSight
        run: |
          git clone --depth 50 https://github.com/emiliano-go/trustsight.git ../trustsight
          git -C ../trustsight checkout "$TRUSTSIGHT_COMMIT"

      # The harness clones unprivileged user namespaces everywhere: the
      # analysis worker, `bash -n` and the pool.  There is no degradation
      # path, so a runner that cannot create them cannot run the suite at
      # all - fail loudly here rather than as a wall of refusals later.
      # Ubuntu 24.04 lets AppArmor restrict unprivileged userns; lift the
      # restriction where the knob exists, then ask the kernel directly.
      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Lockfile-only. A harness that resolves fresh dependencies at test
      # time is not the harness whose results were published.
      - name: Sync (locked)
        run: uv sync --locked --all-extras

      - name: Self-security gates
        run: uv run pytest tests/test_self_security.py -q

      - name: Secret scan
        run: uv run python scripts/scan_secrets.py

      - name: Validator calibration
        run: uv run pytest tests/test_validators.py -q

      - name: Pinned TrustSight matches the declared version
        # The campaigns declare an instrument version at runtime; nothing
        # else in CI reads it, which is how the repo once pinned 0.14.0 in
        # CI while every campaign declared 0.13.2.  The commit check closes
        # the other half: the checkout must be the pinned commit, not just
        # some tree that reports the right version string.
        run: |
          head=$(git -C ../trustsight rev-parse HEAD)
          test "$head" = "$TRUSTSIGHT_COMMIT" || {
            echo "checked out $head, expected $TRUSTSIGHT_COMMIT" >&2; exit 1; }
          uv run python -c "import trustsight, yaml; declared = yaml.safe_load(open('defaults/environment.yml'))['trustsight_version']; assert trustsight.__version__ == declared, (trustsight.__version__, declared); print('trustsight', trustsight.__version__, 'at', '$head')"

      - name: Full test suite
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Docs site builds without warnings
        run: |
          uv run zensical build --strict
          uv run python scripts/build_llms_txt.py
          uv run python scripts/build_llms_txt.py --check

  regression:
    # A full replay writes gigabytes and restores the database per bypass, so
    # it is split by global position: each shard replays one slice and the
    # merge job stitches the verdicts back into the whole-corpus report.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve the pinned TrustSight commit
        run: echo "TRUSTSIGHT_COMMIT=$(cat .github/trustsight-commit)" >> "$GITHUB_ENV"

      - name: Clone TrustSight
        run: |
          git clone --depth 50 https://github.com/emiliano-go/trustsight.git ../trustsight
          git -C ../trustsight checkout "$TRUSTSIGHT_COMMIT"

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync (locked)
        run: uv sync --locked --all-extras

      - name: Replay shard ${{ matrix.shard }}/4
        run: >-
          uv run python -m harness regression
          --shard ${{ matrix.shard }}/4
          --jobs auto

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-shard-${{ matrix.shard }}
          path: regression/shard-${{ matrix.shard }}.json

  regression-merge:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve the pinned TrustSight commit
        run: echo "TRUSTSIGHT_COMMIT=$(cat .github/trustsight-commit)" >> "$GITHUB_ENV"

      - name: Clone TrustSight
        run: |
          git clone --depth 50 https://github.com/emiliano-go/trustsight.git ../trustsight
          git -C ../trustsight checkout "$TRUSTSIGHT_COMMIT"

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync (locked)
        run: uv sync --locked --all-extras

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regression-shard-*
          path: regression/shards
          merge-multiple: true

      # Refuses an incomplete or duplicated shard set, and verifies every
      # shard was measured under the same instrument before it writes the
      # report. The checkout is disposable, so the archive is not updated.
      - name: Merge the shards
        run: >-
          uv run python -m harness regression
          --merge-shards regression/shards
          --no-archive

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-report
          path: regression/report.json

  # An SBOM is only useful if it describes a build someone can obtain, so
  # it is generated from the lockfile on a tag and attached to the release
  # rather than regenerated from whatever a consumer happens to install.
  sbom:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve the pinned TrustSight commit
        run: echo "TRUSTSIGHT_COMMIT=$(cat .github/trustsight-commit)" >> "$GITHUB_ENV"

      - name: Clone TrustSight
        run: |
          git clone --depth 50 https://github.com/emiliano-go/trustsight.git ../trustsight
          git -C ../trustsight checkout "$TRUSTSIGHT_COMMIT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Generate SBOM
        run: uv run python scripts/sbom.py sbom.cyclonedx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
