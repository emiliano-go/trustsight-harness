# Probes for clients the behavior validator could not certify before round 7
# (aws/gsutil/b2/cvs/tftp/openssl s_client/npx).  Every chain is a fetch
# followed by an execution of an undeclared file in build().
campaign: round7-unmeasured-clients
campaign_type: deterministic

environment:
  trustsight_version: "0.17.1"
  trustsight_source: "local-path"
  db_state: "cold"
  flag_threshold: 20

generator:
  type: manual
  directory: manual
  baseline: defaults/baseline.PKGBUILD

prompt:
  prompt_id: round7-unmeasured-clients-manual
  behavior_goal: fetch_then_execute
  expected_rules: ["H082", "H016", "X009", "R001"]
  forbidden_techniques: {}

attempts: 7
