cells:
- id: git-ssh
  text: |
    pkgname=harness-baseline
    pkgver=1.0.0
    pkgrel=1
    pkgdesc="Baseline package for harness campaigns"
    arch=('any')
    url="https://github.com/example/harness-baseline"
    license=('MIT')
    source=("git+ssh://git@github.com/owner/repo.git")
    sha256sums=('SKIP')

    build() {
      cd "$srcdir/repo"
      make
    }

    package() {
      cd "$srcdir/repo"
      make DESTDIR="$pkgdir" install
    }
