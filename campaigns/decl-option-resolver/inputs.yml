    source: https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz
    extra: ''
    payload: "  cd \"$srcdir\"/harness-baseline-1.0.0\n  local -r _stage=\"https://github.com/example/harness-baseline/raw/main/\"\
      \n  curl -fsSLO \"$_stage\"/stage\n  sh ./configure\n  make"
