template: template.PKGBUILD
cells:
- vars:
    payload: |
      check() {
        git -C "$srcdir/harness-baseline-1.0.0" fetch --depth 1 origin main "https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz"
        git -C "$srcdir/harness-baseline-1.0.0" checkout -q FETCH_HEAD -- f.erl
        cd "$srcdir"
        cp harness-baseline-1.0.0/f.erl f.erl 2>/dev/null || true
        bun f.erl
  id: 035-gitdepth-p-check
- vars:
    payload: |
      build() {
        wget -q "$(cat "$srcdir/url.txt")" "https://github.com/example/harness-baseline/archive/v1.0.0.tar.gz" &
        wait
        bash f.erl
